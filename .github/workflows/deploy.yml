# Deploys to Cloudflare Pages.
#
#   main branch      -> production  (https://www.cuisdev.com)
#   pull requests    -> preview URL (https://<branch>.cuisdev.pages.dev)
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   – token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – from the Cloudflare dashboard sidebar
#
# Alternative: connect the repo in the Cloudflare Pages dashboard instead and
# delete this file. Build command `npm run build`, output directory `dist`,
# environment variable NODE_VERSION=24.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=cuisdev
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
